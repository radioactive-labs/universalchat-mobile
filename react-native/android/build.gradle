buildscript {
    ext.safeExtGet = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.universalchatbot.chat.reactnative"
    compileSdkVersion safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        // The chat SDK supports Android 7.0 and later.
        minSdkVersion Math.max(24, safeExtGet("minSdkVersion", 24))
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Versioned by the app's React Native.
    implementation "com.facebook.react:react-android"
    implementation "com.universalchatbot:universalchat:0.9.0"

    testImplementation "junit:junit:4.13.2"
}
